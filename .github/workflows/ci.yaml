name: ci

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-flight runs on the same ref to save runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"
  SQLX_OFFLINE: "true"

jobs:
  # ── Rust fmt + clippy + unit tests on SQLite ────────────────────────────────
  rust:
    name: rust (fmt + clippy + test, sqlite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test (workspace, sqlite default)
        run: cargo test --workspace --all-targets --no-fail-fast

  # ── End-to-end test against a real MySQL instance ─────────────────────────
  mysql:
    name: integration (mysql 8)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: rblog
          MYSQL_USER: rblog
          MYSQL_PASSWORD: rblog
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      DATABASE_URL: mysql://rblog:rblog@127.0.0.1:3306/rblog

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: wait for mysql
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -uroot -proot --silent; then
              echo "mysql is up"; break
            fi
            sleep 2
          done

      - name: cargo test (mysql backend)
        env:
          RBLOG_TEST_MYSQL_URL: ${{ env.DATABASE_URL }}
        run: cargo test --workspace --all-targets --no-fail-fast -- --include-ignored mysql

  # ── Admin SPA: type-check + production build ──────────────────────────────
  admin:
    name: admin spa (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
          run_install: false

      - name: pnpm install
        run: pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile

      - name: typecheck
        run: pnpm run typecheck

      - name: build
        run: pnpm run build

  # ── Release-mode build with embed-admin, exercises the path docker uses ───
  embed-build:
    name: release build (embed-admin)
    runs-on: ubuntu-latest
    needs: [rust, admin]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: build admin spa
        working-directory: admin
        run: |
          pnpm install --no-frozen-lockfile
          pnpm run build

      - name: cargo build --release --features embed-admin
        run: cargo build --release --bin rblog --features rblog-http/embed-admin
