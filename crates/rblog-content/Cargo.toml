[package]
name = "rblog-content"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Halo-compatible typed Extension kinds: Post, Snapshot, Category, Tag, Comment, Reply, SinglePage, User, Role, Menu, Setting, ConfigMap, Attachment, Theme, Counter, Plugin, ..."

[lints]
workspace = true

[dependencies]
rblog-scheme.workspace = true

serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true

# markdown pipeline
comrak = { version = "0.43", default-features = false }
ammonia = "4"
syntect = { version = "5", default-features = false, features = [
    "default-syntaxes",
    "default-themes",
    "parsing",
    "regex-onig",
    "html",
] }

# unified-diff patching
similar = "2"

[dev-dependencies]
pretty_assertions = "1"
rblog-store.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
