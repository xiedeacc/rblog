{% if pagination and pagination.total_pages > 1 %}
  <nav class="pagination">
    {% if pagination.has_prev %}<a href="{{ pagination.prev_url }}">previous</a>{% endif %}
    <label class="pagination-page-select">
      <span>page</span>
      <select aria-label="Select page" onchange="if (this.value) window.location.href = this.value">
        {% for item in pagination.pages %}
          <option value="{{ item.url }}"{% if item.current %} selected{% endif %}>{{ item.page }}</option>
        {% endfor %}
      </select>
      <span>of {{ pagination.total_pages }}</span>
    </label>
    {% if pagination.has_next %}<a href="{{ pagination.next_url }}">next</a>{% endif %}
  </nav>
{% endif %}
